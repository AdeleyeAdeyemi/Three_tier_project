<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        .message {
            padding: 10px;
            margin: 5px 0;
        }

        .error {
            padding: 10px;
            margin: 5px 0;
        }

        h1 {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <main id="myPlatform" class="container">
        <h1>My Platform</h1>

        <section class="container">
            <h2>Updates</h2>
            <p id="timestamp">No update available</p>
            <p id="title">No update message</p>
        </section>

        <section class="container">
            <h2>Messages</h2>
            <ul id="messages">
                <li>No messages</li>
            </ul>
        </section>

        <section class="container">
            <h2>Errors</h2>
            <ul id="errors">
                <li>No errors</li>
            </ul>
        </section>
    </main>

</body>
</html>
