<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Platform - Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
        }

        #account {
            max-width: 1100px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .products {
            max-width: 1100px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .product h2 {
            margin-top: 0;
        }

        .description {
            color: #666;
            min-height: 45px;
        }

        .price {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .stock {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        #status {
            max-width: 1100px;
            margin: 20px auto;
        }

        hr {
            max-width: 1100px;
            margin: 30px auto;
        }

        .products-title {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Platform Dashboard</h1>
        <p class="subtitle" id="welcome">
            Loading your account...
        </p>
    </header>

    <div id="status">
        Loading dashboard...
    </div>

    <section id="account"></section>

    <hr>

    <h2 class="products-title">Products</h2>

    <main id="products" class="products"></main>

    <script>

        async function loadDashboard() {
            const status = document.getElementById("status");
            const welcome = document.getElementById("welcome");
            const account = document.getElementById("account");

            try {
                const response = await fetch(
                    "http://localhost:5000/api/dashboard",
                    {
                        credentials: "include"
                    }
                );

                if (!response.ok) {
                    throw new Error("Authentication required");
                }

                const data = await response.json();
                const user = data.user;

                welcome.textContent =
                    `Welcome back, ${user.first_name} ${user.last_name}`;

                account.innerHTML = `
                    <h2>Account</h2>
                    <p>
                        <strong>Name:</strong>
                        ${user.first_name} ${user.last_name}
                    </p>
                    <p>
                        <strong>Email:</strong>
                        ${user.email}
                    </p>
                `;

                status.textContent =
                    "Dashboard loaded successfully";

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Please log in to access your dashboard.";
            }
        }


        async function loadProducts() {
            const status = document.getElementById("status");
            const productsContainer =
                document.getElementById("products");

            try {
                const response = await fetch(
                    "http://localhost:5000/api/products"
                );

                if (!response.ok) {
                    throw new Error("Failed to load products");
                }

                const data = await response.json();

                productsContainer.innerHTML = "";

                if (data.products.length === 0) {
                    status.textContent =
                        "No products available.";
                    return;
                }

                status.textContent =
                    `${data.products.length} products available`;

                data.products.forEach(product => {
                    const productElement =
                        document.createElement("article");

                    productElement.className = "product";

                    productElement.innerHTML = `
                        <h2>${product.name}</h2>

                        <p class="description">
                            ${product.description}
                        </p>

                        <p class="price">
                            £${Number(product.price).toFixed(2)}
                        </p>

                        <p class="stock">
                            ${product.stock} available
                        </p>

                        <button
                            ${product.stock === 0 ? "disabled" : ""}
                            onclick="addToCart(${product.id})"
                        >
                            ${
                                product.stock === 0
                                    ? "Out of Stock"
                                    : "Add to Cart"
                            }
                        </button>
                    `;

                    productsContainer.appendChild(productElement);
                });

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Unable to load products from the backend.";
            }
        }


        function addToCart(productId) {
            console.log(
                "Add product to cart:",
                productId
            );
        }


        loadDashboard();
        loadProducts();

    </script>

</body>
</html>
