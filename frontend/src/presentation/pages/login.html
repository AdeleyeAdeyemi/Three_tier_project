<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Platform - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>My Platform</h1>

        <p>Log in to your account</p>

        <form id="login-form">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

        <p id="message"></p>

    </main>

    <script>
        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            message.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.error || "Login failed";

                    return;
                }

                message.textContent =
                    "Login successful. Redirecting...";

                window.location.href = "/";

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Unable to connect to the backend.";
            }
        });
    </script>

</body>
</html>
